services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${DB_USER:-practiceuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-practicedb}
    volumes:
      - postgres-practice-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practiceuser -d practicedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-practice-data:
    external: true
    name: docker-node-demo_postgres-practice-data
